<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridTwin inspection wall</title>
<link rel="stylesheet" href="wall.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.min.js", "three/addons/controls/OrbitControls.js": "/vendor/OrbitControls.js",
               "@sparkjsdev/spark": "/vendor/spark.module.min.js" } }
</script>
</head>
<body>
<header class="top">
  <div class="crumb"><a id="backLink" href="./">← GridTwin</a><strong>Plant inspection wall</strong></div>
  <div class="controls">
    <select id="runPick" aria-label="Run"></select>
    <span id="modeTag" class="tag"></span>
    <span id="replayCtl" hidden>
      <button id="btnRestart" title="Restart">⏮</button>
      <button id="btnPlay" title="Play or pause">⏸</button>
      <button id="btnStep" title="Step one event">⏭</button>
      <label class="speed">speed <input id="speed" type="range" min="0.25" max="8" step="0.25" value="1"> <span id="speedVal">1×</span></label>
    </span>
    <span id="views" class="mono"></span>
  </div>
</header>
<div class="progress"><i id="progressBar"></i></div>

<div id="summary" class="summary"></div>

<section id="twin" class="twin" hidden>
  <div id="twinView" class="twin-view"></div>
  <div class="twin-cap"><b>Plant twin</b> · Gaussian splat skinned from site photos · drag to orbit, click a camera to jump to it
    <span class="twin-btns"><button id="twinThermal" title="Thermal view: assets with a failed check glow">thermal</button><button id="twinHome" title="Whole plant">overview</button><button id="twinHide" title="Hide the 3D view">hide</button></span></div>
  <div id="twinShot" class="twin-shot" hidden></div>
</section>
<main class="layout">
  <section id="tiles" class="tiles" aria-label="Camera stations"></section>
  <aside class="side">
    <h2>Top-down map</h2>
    <div id="map"></div>
    <div class="legend">
      <span><i class="dot verified"></i>verified</span>
      <span><i class="dot failed"></i>failed / paged</span>
      <span><i class="dot analyzing"></i>analyzing</span>
      <span><i class="dot seen"></i>seen, no check</span>
      <span><i class="dot idle"></i>not visited</span>
    </div>
    <p id="final" class="final"></p>
  </aside>
</main>
<script src="wall.js"></script>
<script type="module" src="wall-splat.js"></script>
</body>
</html>
