# Contract C5. Workstream 3 owns this file after the first push (poses get filled in from the splat).
# Each demo asset has three named viewpoints, so a visual check can use one no worker called
# (gridtwin/agents/verifier.py). An asset's viewpoints share its modes, since list_assets doesn't report
# modes, and all of them show the same photo state: the photo bank is the visual state, not the pose.
viewpoints:
  inv1_cabinet: {asset: INV-1, modes: [rgb, thermal], pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv1_intake: {asset: INV-1, modes: [rgb, thermal], label: INV-1 air intake, heading_deg: 90, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv1_rear: {asset: INV-1, modes: [rgb, thermal], label: INV-1 cabinet rear, heading_deg: 180, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv2_cabinet: {asset: INV-2, modes: [rgb], pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv2_display: {asset: INV-2, modes: [rgb], label: INV-2 display, heading_deg: 90, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv2_side: {asset: INV-2, modes: [rgb], label: INV-2 cabinet side, heading_deg: 270, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv3_cabinet: {asset: INV-3, modes: [rgb], pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv3_display: {asset: INV-3, modes: [rgb], label: INV-3 display, heading_deg: 90, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  inv3_side: {asset: INV-3, modes: [rgb], label: INV-3 cabinet side, heading_deg: 270, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  xfmr1_yard: {asset: XFMR-1, modes: [rgb], pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  xfmr1_tank: {asset: XFMR-1, modes: [rgb], label: XFMR-1 tank and radiators, heading_deg: 90, pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  xfmr1_fence: {asset: XFMR-1, modes: [rgb], label: XFMR-1 from the yard fence, heading_deg: 270, pose: {position: [0, 0, 0], target: [0, 0, 0]}}

# MVP photo states per asset (folders under assets/photos/<ASSET>/<state>/)
states:
  INV-1: [healthy, filter_clogged, thermal_normal, thermal_hot]
  INV-2: [healthy, display_off]
  INV-3: [healthy, display_off]
  XFMR-1: [normal, oil_leak]
