  b3_corner: {asset: B3, modes: [rgb], label: B3 array corner, heading_deg: 45, map_xy: [24, 150], pose: {position: [0, 0, 0], target: [0, 0, 0]}}
  b4_corner: {asset: B4, modes: [rgb], label: B4 array corner, heading_deg: 45, map_xy: [24, 200], pose: {position: [0, 0, 0], target: [0, 0, 0]}}
